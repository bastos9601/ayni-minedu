name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Build info
        run: |
          echo "✅ Build iniciado exitosamente"
          echo "📱 Plataforma: Android"
          echo "📦 Tipo: APK"
          echo "🔗 Para ver el progreso y descargar el APK:"
          echo "   1. Ve a https://expo.dev"
          echo "   2. Inicia sesión con tu cuenta"
          echo "   3. Ve a la sección 'Builds'"
          echo "   4. Encuentra el build más reciente"
          echo "   5. Descarga el APK cuando esté listo"
